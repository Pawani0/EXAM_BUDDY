<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exam Buddy - Syllabus Extractor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-4xl">
    <h1 class="text-2xl font-bold text-center mb-6">📘 Exam Buddy - Syllabus Extractor</h1>

    <!-- Upload PDF -->
    <form id="uploadForm" class="flex flex-col items-center space-y-4 mb-8">
      <label class="font-medium text-gray-700">Upload PDF</label>
      <input type="file" id="fileInput" accept="application/pdf"
        class="block w-full text-sm text-gray-700 file:mr-4 file:py-2 file:px-4
               file:rounded-full file:border-0 file:text-sm file:font-semibold
               file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100">
      <button type="submit"
        class="px-6 py-2 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition">
        Extract from PDF
      </button>
    </form>

    <!-- Or Paste Text -->
    <form id="textForm" class="flex flex-col space-y-4">
      <label for="syllabusText" class="font-medium text-gray-700">Or paste syllabus text</label>
      <textarea id="syllabusText" rows="6"
        class="w-full border rounded-xl p-3 text-gray-700 focus:ring-2 focus:ring-blue-500"
        placeholder="Paste syllabus text here..."></textarea>
      <button type="submit"
        class="px-6 py-2 rounded-xl bg-green-600 text-white font-semibold hover:bg-green-700 transition">
        Extract from Text
      </button>
    </form>

    <!-- Loader -->
    <div id="loader" class="hidden mt-6 text-center">
      <p class="text-gray-600 animate-pulse">⏳ Extracting syllabus, please wait...</p>
    </div>

    <!-- Output -->
    <div id="output" class="mt-6 hidden">
      <h2 class="text-xl font-semibold mb-4">📑 Extracted Syllabus</h2>
      <div id="units" class="space-y-4"></div>
      <div class="mt-4 flex gap-3">
        <button onclick="expandAll()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">Expand All</button>
        <button onclick="collapseAll()" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">Collapse All</button>
      </div>
    </div>
  </div>

  <script>
    const uploadForm = document.getElementById("uploadForm");
    const textForm = document.getElementById("textForm");
    const fileInput = document.getElementById("fileInput");
    const syllabusText = document.getElementById("syllabusText");
    const loader = document.getElementById("loader");
    const output = document.getElementById("output");
    const unitsContainer = document.getElementById("units");

    const API_BASE = "http://127.0.0.1:8000";

    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      if (!file) {
        alert("Please select a PDF file first.");
        return;
      }
      await extractFromPDF(file);
    });

    textForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = syllabusText.value.trim();
      if (!text) {
        alert("Please paste some text first.");
        return;
      }
      await extractFromText(text);
    });

    async function extractFromPDF(file) {
      showLoader(true);
      const formData = new FormData();
      formData.append("file", file);
      try {
        const response = await fetch(`${API_BASE}/extract_syllabus/`, {
          method: "POST",
          body: formData,
        });
        const data = await response.json();
        console.log(data);
        renderUnits(data);
      } catch (error) {
        alert("❌ Error extracting from PDF: " + error.message);
      } finally {
        showLoader(false);
      }
    }

    async function extractFromText(text) {
      showLoader(true);
      try {
        const response = await fetch(`${API_BASE}/extract_syllabus_text/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(text),
        });
        const data = await response.json();
        console.log(data);
        renderUnits(data);
      } catch (error) {
        alert("❌ Error extracting from text: " + error.message);
      } finally {
        showLoader(false);
      }
    }

    function renderUnits(data) {
  unitsContainer.innerHTML = "";

  // If backend returned stringified JSON, parse it
  if (typeof data === "string") {
    try {
      data = JSON.parse(data);
    } catch (e) {
      unitsContainer.innerHTML = `<p class="text-red-600">⚠️ Invalid JSON response</p>`;
      return;
    }
  }

  if (!Array.isArray(data)) {
    unitsContainer.innerHTML = `<p class="text-red-600">⚠️ ${data.error || "Unexpected response"}</p>`;
    return;
  }

  output.classList.remove("hidden");

  data.forEach((unit, index) => {
    const card = document.createElement("div");
    card.className = "border rounded-xl shadow-sm bg-gray-50";

    card.innerHTML = `
      <button class="w-full text-left px-4 py-3 flex justify-between items-center font-semibold text-gray-800 hover:bg-gray-100 transition" onclick="toggleTopics('topics-${index}')">
        <span>${unit.unit}: ${unit.unit_name}</span>
        <span class="text-gray-500">▼</span>
      </button>
      <div id="topics-${index}" class="hidden px-6 pb-4">
        <ul class="list-disc pl-6 space-y-1 text-gray-700">
          ${unit.topics.map(topic => `<li>${topic}</li>`).join("")}
        </ul>
      </div>
    `;

    unitsContainer.appendChild(card);
  });
}

    function showLoader(state) {
      if (state) loader.classList.remove("hidden");
      else loader.classList.add("hidden");
    }

    function toggleTopics(id) {
      const el = document.getElementById(id);
      el.classList.toggle("hidden");
    }

    function expandAll() {
      document.querySelectorAll("[id^='topics-']").forEach(el => el.classList.remove("hidden"));
    }

    function collapseAll() {
      document.querySelectorAll("[id^='topics-']").forEach(el => el.classList.add("hidden"));
    }
  </script>
</body>
</html>
