version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam_buddy_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Database configuration (points at the deployed/managed DB)
      DATABASE_URL: ${DATABASE_URL}

      # API Keys (set these in .env file)
      GROQ_API_KEY: ${GROQ_API_KEY}

      # Tesseract OCR path
      TESSERACT_CMD: /usr/bin/tesseract

      # Application settings
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/universities"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: exam_buddy_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: exam_buddy_network
